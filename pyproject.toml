[project]
name = "kener-mcp"
version = "0.1.0"
description = "MCP server for managing incidents on Kener v4 status pages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alpha Omega Team", email = "andrew@alphaomegateam.co" }]
requires-python = ">=3.11"
keywords = ["mcp", "kener", "status-page", "incidents", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/alphaomegateam/kener-mcp"
Issues = "https://github.com/alphaomegateam/kener-mcp/issues"
Changelog = "https://github.com/alphaomegateam/kener-mcp/blob/main/CHANGELOG.md"

[project.scripts]
kener-mcp = "kener_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
